services:
  - type: web
    name: gem-sentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: VERIFICATION_ADAPTER_MODE
        value: MOCK
      - key: DATABASE_URL
        fromDatabase:
          name: gem-sentinel-db
          property: connectionString

databases:
  - name: gem-sentinel-db
    databaseName: gemsentinel
    user: gemsentinel
    plan: free
